[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-studio-backend"
version = "0.1.0"
description = "Agent Studio backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "alembic==1.13.3",
    "python-dotenv==1.0.1",
    "boto3==1.36.3",
    "langchain==0.2.14",
    "langchain-aws==0.1.15",
    "langchain-core==0.2.23",
    "langchain-chroma==0.1.4",
    "langchain-text-splitters==0.0.2",
    "langgraph==0.1.32",
    "chromadb==0.5.3",
    "PyPDF2==4.3.1",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "textstat==0.7.3",
    "pyjwt==2.9.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.2",
    "mypy==1.14.0",
    "types-python-dotenv==1.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = ["E", "F", "W", "I", "UP", "RUF"]
lint.ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
